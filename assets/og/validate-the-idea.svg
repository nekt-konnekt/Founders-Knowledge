<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#e8f3ff"/><circle cx="1000" cy="110" r="210" fill="#d9e9ff"/><circle cx="1060" cy="120" r="110" fill="#a9d6ff"/><text x="76" y="92" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#1668b8">FOUNDERS KNOWLEDGE</text><text x="76" y="250" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#201a2e">Validate the idea</text><text x="76" y="330" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#2e9bff">before you build.</text><rect x="78" y="390" width="520" height="8" rx="4" fill="#d7f75f"/><text x="78" y="455" font-family="Arial,sans-serif" font-size="27" fill="#494052">Test the problem. Look for evidence.</text><text x="78" y="495" font-family="Arial,sans-serif" font-size="27" fill="#494052">Learn before making a big commitment.</text><rect x="840" y="330" width="250" height="180" rx="24" fill="#fff" transform="rotate(8 965 420)"/><text x="885" y="400" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1668b8" transform="rotate(8 965 420)">TEST FIRST</text><path d="M900 440 l35 30 70 -78" fill="none" stroke="#2e9bff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><rect x="1040" y="530" width="100" height="46" rx="23" fill="#d7f75f"/><text x="1060" y="560" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#201a2e">FK</text></svg>