    <text x="22" y="76" fill="#1a0f2e" font-family="Fredoka, Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Reach.</text>
    <text x="22" y="111" fill="#1a0f2e" font-family="Fredoka, Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Trust. Earn.</text>
    <rect x="20" y="122" width="170" height="9" rx="4" fill="#fde047" stroke="#1a0f2e" stroke-width="1.5"/>
  </g>
  <text x="1090" y="605" text-anchor="end" fill="#786d8e" font-family="Space Grotesk, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">FIELD NOTE / 22 OCT 2026</text>
