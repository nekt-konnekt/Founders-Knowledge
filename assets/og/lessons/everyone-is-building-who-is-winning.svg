  <text x="64" y="280" fill="#1a0f2e" font-family="Fredoka, Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="-2">
    <tspan x="64" dy="0">Everyone is building.</tspan>
    <tspan x="64" dy="96">Who is actually winning?</tspan>
  </text>
  <rect x="64" y="435" width="610" height="8" rx="4" fill="#fde047" stroke="#1a0f2e" stroke-width="2" transform="rotate(-1 64 435)"/>
  <text x="68" y="505" fill="#45375d" font-family="Space Grotesk, Arial, Helvetica, sans-serif" font-size="27" font-weight="600">AI lowers the cost of building.</text>
  <text x="68" y="545" fill="#45375d" font-family="Space Grotesk, Arial, Helvetica, sans-serif" font-size="27" font-weight="600">It doesn't remove the work of earning demand.</text>
