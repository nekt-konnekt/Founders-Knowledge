<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Everyone is building. Who is actually winning?">
  <rect width="1200" height="630" fill="#f3ecff"/>
  <circle cx="1070" cy="110" r="150" fill="#fbcfe8"/>
  <circle cx="1100" cy="540" r="150" fill="#bbf7d0"/>
  <path d="M810 95 C940 60 1030 150 1050 250" fill="none" stroke="#1a0f2e" stroke-width="3" stroke-dasharray="8 10" opacity=".5"/>
  <rect x="64" y="38" width="56" height="56" rx="11" fill="#fde047" stroke="#1a0f2e" stroke-width="2"/>
  <text x="92" y="75" text-anchor="middle" fill="#1a0f2e" font-family="Space Grotesk, Arial, Helvetica, sans-serif" font-size="30" font-weight="700">FK</text>
  <text x="136" y="78" fill="#1a0f2e" font-family="Space Grotesk, Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Founders Knowledge</text>
  <rect x="64" y="142" width="340" height="38" rx="10" fill="#e9d5ff" stroke="#1a0f2e" stroke-width="2"/>
