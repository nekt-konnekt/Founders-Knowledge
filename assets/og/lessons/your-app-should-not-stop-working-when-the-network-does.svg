<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Your App Should Not Stop Working When the Network Does</title><desc id="desc">Founders Knowledge guide to offline-first product design, local data and synchronization.</desc><rect width="1200" height="630" fill="#e8f3ff"/><circle cx="1050" cy="85" r="170" fill="#bfe0ff"/><circle cx="1080" cy="580" r="220" fill="#ffd9c4"/><rect x="64" y="42" width="54" height="54" rx="12" fill="#1d7fe0"/><text x="91" y="79" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">FK</text><text x="135" y="80" fill="#12263a" font-family="Arial,sans-serif" font-size="42" font-weight="700">Founders Knowledge</text><text x="64" y="190" fill="#1668b8" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">PRODUCT ENGINEERING / PRACTICAL GUIDE</text><text x="64" y="290" fill="#12263a" font-family="Arial,sans-serif" font-size="68" font-weight="700">Your App Should Not</text><text x="64" y="372" fill="#12263a" font-family="Arial,sans-serif" font-size="68" font-weight="700">Stop Working When</text><text x="64" y="454" fill="#12263a" font-family="Arial,sans-serif" font-size="68" font-weight="700">the Network Does</text><rect x="66" y="505" width="360" height="58" rx="10" fill="#c8f04b"/><text x="90" y="542" fill="#12263a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Design for offline-first work</text><g transform="translate(820 160)"><rect x="0" y="0" width="290" height="350" rx="24" fill="#fff" stroke="#a9c6de" stroke-width="3"/><text x="28" y="48" fill="#12263a" font-family="Arial,sans-serif" font-size="22" font-weight="700">WORKFLOW STATUS</text><rect x="25" y="78" width="240" height="72" rx="12" fill="#e4f6e9"/><circle cx="58" cy="114" r="17" fill="#21864b"/><path d="M49 114l7 7 13-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="88" y="109" fill="#12263a" font-family="Arial,sans-serif" font-size="18" font-weight="700">Saved locally</text><text x="88" y="132" fill="#456078" font-family="Arial,sans-serif" font-size="14">Your work is safe here</text><rect x="25" y="166" width="240" height="72" rx="12" fill="#e8f3ff"/><circle cx="58" cy="202" r="17" fill="#1d7fe0"/><path d="M58 190v12l9 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="88" y="197" fill="#12263a" font-family="Arial,sans-serif" font-size="18" font-weight="700">Waiting to sync</text><text x="88" y="220" fill="#456078" font-family="Arial,sans-serif" font-size="14">Will send when online</text><rect x="25" y="254" width="240" height="72" rx="12" fill="#fff0eb"/><circle cx="58" cy="290" r="17" fill="#c44b32"/><text x="58" y="297" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">!</text><text x="88" y="285" fill="#12263a" font-family="Arial,sans-serif" font-size="18" font-weight="700">Needs attention</text><text x="88" y="308" fill="#456078" font-family="Arial,sans-serif" font-size="14">A conflict needs review</text></g></svg>