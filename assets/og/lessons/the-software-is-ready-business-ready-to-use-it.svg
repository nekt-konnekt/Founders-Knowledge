<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Software Is Ready. Is the Business Ready to Use It?">
  <rect width="1200" height="630" fill="#e8f3ff"/>
  <rect x="64" y="42" width="56" height="56" rx="12" fill="#1d7fe0"/>
  <text x="92" y="80" text-anchor="middle" fill="#ffffff" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="700">FK</text>
  <text x="138" y="82" fill="#12263a" font-family="Space Grotesk, Arial, sans-serif" font-size="48" font-weight="700">Founders Knowledge</text>
  <text x="64" y="230" fill="#1d7fe0" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">PRODUCT &amp; DESIGN</text>
  <text x="64" y="330" fill="#12263a" font-family="Fredoka, Arial, sans-serif" font-size="70" font-weight="600"><tspan x="64" dy="0">The Software Is Ready.</tspan><tspan x="64" dy="82">Is the Business Ready</tspan><tspan x="64" dy="82">to Use It?</tspan></text>
  <rect x="824" y="174" width="312" height="300" rx="26" fill="#ffffff" stroke="#a9c6de" stroke-width="2"/>
  <text x="864" y="222" fill="#40566b" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">THE WORKDAY TEST</text>
  <g font-family="Space Grotesk, Arial, sans-serif" font-size="19" font-weight="700">
    <rect x="864" y="252" width="232" height="36" rx="10" fill="#bfe0ff"/><text x="882" y="276" fill="#12263a">01  Choose one job</text>
    <rect x="864" y="300" width="232" height="36" rx="10" fill="#b9ecd2"/><text x="882" y="324" fill="#12263a">02  Complete it once</text>
    <rect x="864" y="348" width="232" height="36" rx="10" fill="#ffd9c4"/><text x="882" y="372" fill="#12263a">03  Repeat without help</text>
    <rect x="864" y="396" width="232" height="36" rx="10" fill="#bfe0ff"/><text x="882" y="420" fill="#12263a">04  Hand it off</text>
    <rect x="864" y="444" width="232" height="36" rx="10" fill="#c8f04b"/><text x="882" y="468" fill="#12263a">05  Make it routine</text>
  </g>
  <text x="64" y="576" fill="#40566b" font-family="Space Grotesk, Arial, sans-serif" font-size="23">A sign-up is not adoption. Move one real job into a workflow the team trusts.</text>
</svg>