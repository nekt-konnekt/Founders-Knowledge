<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Offline-first application architecture</title><desc id="d">Customer actions are validated and saved locally, added to a persistent outbox, and synchronized with the server when a network is available.</desc><rect width="1200" height="520" rx="24" fill="#e8f3ff"/><text x="55" y="65" fill="#12263a" font-family="Arial,sans-serif" font-size="30" font-weight="700">A resilient offline-first workflow</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="145" width="190" height="112" rx="18" fill="#fff" stroke="#a9c6de" stroke-width="3"/><text x="150" y="190" fill="#12263a" font-size="22" font-weight="700">Customer</text><text x="150" y="222" fill="#456078" font-size="18">action</text><path d="M245 201h65" stroke="#1668b8" stroke-width="5" stroke-linecap="round"/><path d="M298 188l14 13-14 13" fill="none" stroke="#1668b8" stroke-width="5"/><rect x="315" y="145" width="190" height="112" rx="18" fill="#fff" stroke="#a9c6de" stroke-width="3"/><text x="410" y="190" fill="#12263a" font-size="22" font-weight="700">Validate</text><text x="410" y="222" fill="#456078" font-size="18">input</text><path d="M505 201h65" stroke="#1668b8" stroke-width="5" stroke-linecap="round"/><path d="M558 188l14 13-14 13" fill="none" stroke="#1668b8" stroke-width="5"/><rect x="575" y="145" width="230" height="112" rx="18" fill="#c8f04b" stroke="#a9c6de" stroke-width="3"/><text x="690" y="190" fill="#12263a" font-size="22" font-weight="700">Local database</text><text x="690" y="222" fill="#456078" font-size="18">save immediately</text><path d="M690 257v55" stroke="#1668b8" stroke-width="5" stroke-linecap="round"/><path d="M677 299l13 14 13-14" fill="none" stroke="#1668b8" stroke-width="5"/><rect x="575" y="320" width="230" height="112" rx="18" fill="#fff" stroke="#a9c6de" stroke-width="3"/><text x="690" y="365" fill="#12263a" font-size="22" font-weight="700">Persistent outbox</text><text x="690" y="397" fill="#456078" font-size="18">pending operations</text><path d="M805 376h75" stroke="#1668b8" stroke-width="5" stroke-linecap="round"/><path d="M868 363l14 13-14 13" fill="none" stroke="#1668b8" stroke-width="5"/><rect x="885" y="320" width="250" height="112" rx="18" fill="#fff" stroke="#a9c6de" stroke-width="3"/><text x="1010" y="365" fill="#12263a" font-size="22" font-weight="700">Remote server</text><text x="1010" y="397" fill="#456078" font-size="18">acknowledge safely</text></g><rect x="55" y="335" width="420" height="88" rx="16" fill="#fff0eb" stroke="#efc2b2" stroke-width="2"/><text x="80" y="370" fill="#9b3d2b" font-family="Arial,sans-serif" font-size="19" font-weight="700">No network?</text><text x="80" y="400" fill="#62453e" font-family="Arial,sans-serif" font-size="17">Keep the operation locally; retry later.</text><path d="M475 378h65v-70h150" fill="none" stroke="#c44b32" stroke-width="3" stroke-dasharray="8 8"/></svg>